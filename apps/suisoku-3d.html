<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推測統計を3Dで見る｜数学学習サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
  :root{
    --orange-50:#FFEEE2; --orange-100:#FFDFCA; --orange-400:#FF8D44;
    --orange-700:#E25100; --orange-800:#C74700; --orange-900:#AC3E00;
    --ink:#1E293B; --sub:#475569; --line:#D9DEE6; --line-strong:#B9C2CF;
    --bg:#FBFBFA; --card:#FFFFFF; --focus:#FFD866;
    --pink:#d6336c;
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px;
    --radius-md:8px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;}
  button:focus-visible, input:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .brand-bar{height:6px;background:var(--orange-700);}
  .site-header{background:var(--card);border-bottom:1px solid var(--line);padding:var(--sp-2);}
  .site-header .inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;}
  .site-title{margin:0;font-size:18px;font-weight:700;}
  .site-title a{color:var(--ink);text-decoration:none;}
  .back-link{font-size:14px;font-weight:700;}
  .wrap{max-width:1280px;margin:0 auto;padding:var(--sp-3) var(--sp-2) var(--sp-6);}
  h1{margin:0 0 4px;font-size:26px;line-height:1.4;}
  .lead{margin:0 0 var(--sp-2);color:var(--sub);font-size:15px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-2) var(--sp-3);}
  .section-title{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 var(--sp-1);}
  .btn{border:1px solid var(--line);background:#f8fafc;color:var(--ink);padding:8px 14px;border-radius:var(--radius-pill);font-size:14px;cursor:pointer;font-family:inherit;}
  .btn:hover{border-color:var(--orange-800);background:var(--orange-50);}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn.on{background:var(--orange-700);border-color:var(--orange-700);color:#fff;}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-2);}
  .tab{border:1.5px solid var(--line-strong);background:#fff;padding:10px 18px;border-radius:var(--radius-md);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);}
  .tab .pg{font-weight:400;font-size:12px;margin-left:6px;}
  .tab.active{border-color:var(--orange-700);background:var(--orange-50);color:var(--orange-900);}

  .main-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--sp-2);align-items:start;}
  @media (max-width:980px){ .main-grid{grid-template-columns:1fr;} }
  .stage{padding:0;overflow:hidden;position:relative;}
  .stage canvas{display:block;width:100%;touch-action:none;cursor:grab;}
  .stage canvas:active{cursor:grabbing;}
  .stage-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);}
  .stage-bar .btns{display:flex;gap:8px;flex-wrap:wrap;}

  .stepper{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:var(--sp-2);padding-bottom:12px;border-bottom:1px dashed var(--line);}
  .stepper .progress{font-size:13px;font-weight:700;color:var(--sub);}
  .stepper .btn{font-size:15px;padding:10px 18px;}
  #nextBtn{background:var(--orange-700);color:#fff;border-color:var(--orange-700);}
  #nextBtn:hover{background:var(--orange-800);}
  #nextBtn:disabled{background:#f8fafc;color:var(--ink);border-color:var(--line);}
  .steps{display:flex;flex-direction:column;gap:6px;}
  .step{display:flex;gap:10px;padding:8px;margin:0 -8px;border-radius:var(--radius-md);cursor:pointer;}
  .step:hover{background:#f8fafc;}
  .step.dim{opacity:.4;}
  .step.active{background:var(--orange-50);cursor:default;}
  .step-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .step.dim .step-num{background:#cbd5e1;}
  .step.active .step-num{background:var(--orange-700);}
  .step-title{font-weight:700;font-size:15px;}
  .step-body{display:none;font-size:15px;line-height:1.8;margin-top:6px;}
  .step.active .step-body{display:block;}
  .step-body p{margin:0 0 8px;}
  .step-body b{color:var(--orange-900);}
  .formula{background:#fff;border:1px solid var(--orange-100);border-radius:var(--radius-md);padding:8px 12px;margin:8px 0;font-size:16px;}
  .formula .row{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:4px 0;}
  .theorem{border:1.5px dashed var(--pink);background:#fff5f8;border-radius:var(--radius-md);padding:8px 12px;margin:8px 0;}
  .note{font-size:13px;color:var(--sub);}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 2px;}
  .frac .num, .frac .den{padding:0 4px;white-space:nowrap;}
  .frac .bar{display:block;width:100%;height:2px;background:currentColor;margin:2px 0;}
  .ov{text-decoration:overline;}
  table.words{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;background:#fff;}
  table.words th, table.words td{border:1px solid var(--line);padding:4px 6px;vertical-align:middle;}
  table.words th{background:#f1f5f9;}
  .nbtns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
  input[type=range]{width:100%;accent-color:var(--orange-700);}
</style>

<body>
<div class="brand-bar"></div>
<header class="site-header">
  <div class="inner">
    <p class="site-title"><a href="../index.html">数学学習サイト</a></p>
    <a class="back-link" href="../unit.html?s=mathB&u=tokei-suisoku">← 単元ページに戻る</a>
  </div>
</header>

<div class="wrap">
  <h1>推測統計を3Dで見る </h1>
  <p class="lead">「次へ」を押すと、図が1段階ずつ動きます。図はドラッグすると回転できます。</p>

  <div class="tabs" id="tabs"></div>

  <div class="main-grid">
    <div class="card stage">
      <canvas id="cv"></canvas>
      <div class="stage-bar">
        <span>ドラッグで回転・ホイール／ピンチで拡大縮小</span>
        <span class="btns">
          <button class="btn" id="replayBtn">↻ この段階をもう一度</button>
          <button class="btn" id="viewBtn">視点を戻す</button>
          <button class="btn" id="autoBtn">▶ 通しで自動再生</button>
        </span>
      </div>
    </div>

    <div class="card">
      <p class="section-title">考え方のステップ</p>
      <div class="stepper">
        <button class="btn" id="prevBtn">◀ 前へ</button>
        <span class="progress" id="progress"></span>
        <button class="btn" id="nextBtn">次へ ▶</button>
      </div>
      <div class="steps" id="steps"></div>
      <p class="note" style="margin:12px 0 0">※ 図の数値は説明用に作ったデータ（シミュレーション）です。</p>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
const fr = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="bar"></span><span class="den">${d}</span></span>`;
const XB = '<span class="ov">X</span>';

// ================= 乱数・統計 =================
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0; while(u===0)u=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r()); }
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const npdf = (x,m,s) => Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
function pickIdx(r, N, n){ const s=new Set(); while(s.size<n) s.add(Math.floor(r()*N)); return [...s]; }

// ---- 第1章：A市の20歳男子240人の身長（仮のデータ）----
const N1 = 240, H = v => (v-171)*0.5;
const r1 = mulberry32(7);
const POP1 = Array.from({length:N1}, () => ({v: clamp(171+6*gauss(r1),153,189)}));
const MU1 = mean(POP1.map(p=>p.v));
const SD1 = Math.sqrt(mean(POP1.map(p=>(p.v-MU1)**2)));
POP1.forEach(p=>{
  const rad = 6.2*Math.sqrt(r1()), ang = r1()*Math.PI*2;
  p.cloud = {x: rad*Math.cos(ang), z: rad*Math.sin(ang)*0.8, y: 0.42 + (1-(rad/6.2)**2)*2.6*r1()};
});
(function(){ // 母集団分布（2cmごとの山）での位置
  const byBin = {};
  POP1.map((p,i)=>i).sort((a,b)=>POP1[a].v-POP1[b].v).forEach(i=>{
    const b = Math.floor((POP1[i].v-150)/2); (byBin[b]=byBin[b]||[]).push(i);
  });
  Object.keys(byBin).forEach(b=>byBin[b].forEach((i,k)=>{
    POP1[i].hist = {x: H(151+2*b), z: -1.3+(k%4)*0.86, y: 0.42+Math.floor(k/4)*0.84};
    POP1[i].bin = +b;
  }));
})();
const SAMP1 = Array.from({length:240}, () => { const idx=pickIdx(r1,N1,10); return {idx, m: mean(idx.map(i=>POP1[i].v))}; });

// ---- 第2章：へそくり額（仮のデータ・左右非対称）----
const N2 = 240, G = v => (v-150)*0.045;
const r2 = mulberry32(11);
const POP2 = Array.from({length:N2}, () => ({v: clamp(-50*(Math.log(r2()+1e-9)+Math.log(r2()+1e-9)), 2, 395)}));
const MU2 = mean(POP2.map(p=>p.v));
const SD2 = Math.sqrt(mean(POP2.map(p=>(p.v-MU2)**2)));
(function(){
  const byBin = {};
  POP2.map((p,i)=>i).sort((a,b)=>POP2[a].v-POP2[b].v).forEach(i=>{
    const b = Math.floor(POP2[i].v/20); (byBin[b]=byBin[b]||[]).push(i);
  });
  Object.keys(byBin).forEach(b=>byBin[b].forEach((i,k)=>{
    POP2[i].hist = {x: G(10+20*b), z: -1.2+(k%4)*0.8, y: 0.39+Math.floor(k/4)*0.8};
  }));
})();
const gammaPdf = v => v/2500*Math.exp(-v/50);
let ch2N = 20;
const samp2Cache = {};
function samp2(n){
  if(!samp2Cache[n]){ const r=mulberry32(1000+n);
    samp2Cache[n] = Array.from({length:300}, () => { const idx=pickIdx(r,N2,n); return {idx, m: mean(idx.map(i=>POP2[i].v))}; }); }
  return samp2Cache[n];
}

// ---- サイコロ ----
const D = v => (v-3.5)*2.2;
const rd = mulberry32(5);
const SAMPD = Array.from({length:300}, () => { const rolls=Array.from({length:100},()=>1+Math.floor(rd()*6)); return {rolls, m: mean(rolls)}; });
const SD_DIE = Math.sqrt(35/12);

// ================= 3D表示のしくみ =================
const cv = $('cv'), g = cv.getContext('2d');
let W=800, Hc=500, DPR=1, F=600;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; Hc = Math.round(W < 600 ? W*1.05 : W*0.7);
  cv.style.height = Hc+'px'; cv.width = W*DPR; cv.height = Hc*DPR;
  F = Math.min(W*0.78, Hc*1.25);
}
window.addEventListener('resize', resize);

const now = () => performance.now()/1000;
const ease = {
  io: k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2,
  in: k => k*k,
  out: k => 1-(1-k)*(1-k),
  back: k => { const c=1.7; return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2); }
};

// カメラ
let cam = {tx:0,ty:2,tz:0,yaw:.4,pitch:.35,dist:24};
let camFrom = {...cam}, camTo = {...cam}, camT0 = 0, camDur = 1.6;
let user = {yaw:0,pitch:0,zoom:1}, userTo = {yaw:0,pitch:0,zoom:1};
let basis = null;
function setCam(c){ camFrom = {...cam}; camTo = {...camTo, ...c}; camT0 = now(); userTo = {yaw:0,pitch:0,zoom:1}; }
function updateCam(t){
  const k = ease.io(clamp((t-camT0)/camDur,0,1));
  for(const key in camTo) cam[key] = camFrom[key] + (camTo[key]-camFrom[key])*k;
  for(const key in user) user[key] += (userTo[key]-user[key])*0.12;
  const yaw = cam.yaw + user.yaw + Math.sin(t*0.25)*0.04;
  const pitch = clamp(cam.pitch + user.pitch, 0.05, 1.35);
  const dist = cam.dist * user.zoom * 0.8;
  const cp = Math.cos(pitch);
  const pos = {x: cam.tx + dist*cp*Math.sin(yaw), y: cam.ty + dist*Math.sin(pitch), z: cam.tz + dist*cp*Math.cos(yaw)};
  let f = {x: cam.tx-pos.x, y: cam.ty-pos.y, z: cam.tz-pos.z};
  const fl = Math.hypot(f.x,f.y,f.z); f = {x:f.x/fl, y:f.y/fl, z:f.z/fl};
  let r = {x:-f.z, y:0, z:f.x}; const rl = Math.hypot(r.x,r.z); r = {x:r.x/rl, y:0, z:r.z/rl};
  const u = {x: r.y*f.z - r.z*f.y, y: r.z*f.x - r.x*f.z, z: r.x*f.y - r.y*f.x};
  basis = {pos, f, r, u};
}
function P(x,y,z){
  const b = basis, vx=x-b.pos.x, vy=y-b.pos.y, vz=z-b.pos.z;
  const zc = vx*b.f.x+vy*b.f.y+vz*b.f.z;
  if(zc < 0.5) return null;
  const xc = vx*b.r.x+vy*b.r.y+vz*b.r.z, yc = vx*b.u.x+vy*b.u.y+vz*b.u.z;
  return {x: W/2 + xc*F/zc, y: Hc*(Hc>W*0.9?0.6:0.54) - yc*F/zc, d: zc, s: F/zc};
}

// ---- オブジェクト（位置などを時間でなめらかに変化させる）----
const objs = new Map();
function curVals(ob, t){
  const k0 = ob.dur<=0 ? 1 : clamp((t-ob.t0)/ob.dur,0,1), k = ob.ez(k0), v = {};
  for(const key in ob.to){ const a = ob.from[key] ?? ob.to[key]; v[key] = a + (ob.to[key]-a)*k; }
  return v;
}
let keepSet = null;
function place(id, props, o={}){
  const t = now();
  const num = {}, stat = {};
  for(const k in props) (typeof props[k]==='number' ? num : stat)[k] = props[k];
  if(num.a === undefined) num.a = 1;
  let ob = objs.get(id);
  if(!ob){
    ob = {id};
    ob.from = o.from ? {...num, ...o.from} : {...num, a:0};
    objs.set(id, ob);
  } else {
    ob.from = curVals(ob, t);
  }
  Object.assign(ob, stat);
  ob.to = {...ob.from, ...num};
  ob.t0 = t + (o.delay||0); ob.dur = o.dur ?? 1.0; ob.ez = ease[o.ease||'io'];
  ob.dieAt = null;
  if(keepSet) keepSet.add(id);
  return ob;
}
function kill(id){ objs.delete(id); }
function fadeOut(id, dur=0.5){ const ob=objs.get(id); if(!ob) return; place(id,{a:0},{dur}); ob.dieAt = now()+dur; }

// ---- 描画 ----
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function hslRgb(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return [f(0)*255,f(8)*255,f(4)*255]; }
const rgbs = (c,m=1,a=1) => `rgba(${Math.round(Math.min(255,c[0]*m))},${Math.round(Math.min(255,c[1]*m))},${Math.round(Math.min(255,c[2]*m))},${a})`;
const C_LO = hexRgb("4f7cff"), C_MID = hexRgb("ffc23d"), C_HI = hexRgb("e8385a");
const mix = (a,b,t) => a.map((x,i)=>x+(b[i]-x)*t);
const heightColor = v => { const t = clamp((v-158)/26,0,1); return t<.5 ? mix(C_LO,C_MID,t*2) : mix(C_MID,C_HI,(t-.5)*2); };
const moneyColor = v => hslRgb(265 + clamp(v/260,0,1)*70, 60, 58);
const GOLD = hexRgb('f2a900'), IVORY = hexRgb('f6f0e4'), PINK = '#d6336c';

const LIGHT = (()=>{ const l=[0.45,1,0.6], n=Math.hypot(...l); return l.map(x=>x/n); })();
const FACES = [
  {n:[-1,0,0],i:[0,2,6,4]},{n:[1,0,0],i:[1,3,7,5]},
  {n:[0,-1,0],i:[0,1,5,4]},{n:[0,1,0],i:[2,3,7,6]},
  {n:[0,0,-1],i:[0,1,3,2]},{n:[0,0,1],i:[4,5,7,6]}
];
function drawBox(v, col){
  const hw=v.w/2, hh=v.h/2, hd=v.d/2, c=[];
  for(let i=0;i<8;i++){ const p=P(v.x+((i&1)?hw:-hw), v.y+((i&2)?hh:-hh), v.z+((i&4)?hd:-hd)); if(!p) return; c.push(p); }
  const cp = basis.pos;
  g.globalAlpha = v.a;
  FACES.forEach(fc=>{
    const fx=v.x+fc.n[0]*hw, fy=v.y+fc.n[1]*hh, fz=v.z+fc.n[2]*hd;
    if((cp.x-fx)*fc.n[0]+(cp.y-fy)*fc.n[1]+(cp.z-fz)*fc.n[2] <= 0) return;
    const br = 0.62 + 0.45*Math.max(0, fc.n[0]*LIGHT[0]+fc.n[1]*LIGHT[1]+fc.n[2]*LIGHT[2]);
    g.beginPath(); fc.i.forEach((k,j)=> j? g.lineTo(c[k].x,c[k].y) : g.moveTo(c[k].x,c[k].y)); g.closePath();
    g.fillStyle = rgbs(col, br); g.fill();
    g.strokeStyle = rgbs(col, 0.7, 0.5); g.lineWidth = 0.8; g.stroke();
  });
  g.globalAlpha = 1;
}
function drawBall(v, col){
  const p = P(v.x,v.y,v.z); if(!p) return;
  const R = v.r*p.s; if(R<0.3) return;
  g.globalAlpha = v.a;
  const gr = g.createRadialGradient(p.x-R*0.35, p.y-R*0.4, R*0.1, p.x, p.y, R);
  gr.addColorStop(0, rgbs(col,1.45)); gr.addColorStop(0.55, rgbs(col,1)); gr.addColorStop(1, rgbs(col,0.62));
  g.fillStyle = gr; g.beginPath(); g.arc(p.x,p.y,R,0,Math.PI*2); g.fill();
  g.globalAlpha = 1;
}
function drawShadow(x,y,z,rad,a){
  const p = P(x,0.01,z); if(!p) return;
  const R = rad*p.s*(1+y*0.04), sq = Math.max(0.15, Math.sin(clamp(cam.pitch+user.pitch,0.05,1.35)));
  g.globalAlpha = a*0.16/(1+y*0.12);
  g.fillStyle = '#0f172a'; g.beginPath(); g.ellipse(p.x,p.y,R,R*sq,0,0,Math.PI*2); g.fill();
  g.globalAlpha = 1;
}
function richParts(text){
  const parts=[], re=/\{([^|}]*)\|([^}]*)\}/g; let last=0, m;
  while((m=re.exec(text))){ if(m.index>last) parts.push({t:text.slice(last,m.index)}); parts.push({n:m[1],d:m[2]}); last=re.lastIndex; }
  if(last<text.length) parts.push({t:text.slice(last)});
  return parts;
}
function drawRich(text, x, y, size, color, bg, a){
  const parts = richParts(text), fs = size*0.78;
  const fontA = `700 ${size}px ${FONT}`, fontB = `700 ${fs}px ${FONT}`;
  const ws = parts.map(p=>{
    if(p.t!=null){ g.font=fontA; return g.measureText(p.t).width; }
    g.font=fontB; return Math.max(g.measureText(p.n).width, g.measureText(p.d).width)+size*0.35;
  });
  const w = ws.reduce((s,v)=>s+v,0), hasF = parts.some(p=>p.n!=null), h = hasF ? size*2.2 : size*1.45, pad = size*0.45;
  g.globalAlpha = a;
  if(bg){
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.strokeStyle = bg===true ? 'rgba(148,163,184,0.6)' : bg; g.lineWidth = bg===true?1:2;
    g.beginPath(); g.roundRect(x-w/2-pad, y-h/2, w+pad*2, h, size*0.5); g.fill(); g.stroke();
  }
  g.fillStyle = color; g.textBaseline = 'middle';
  let cx = x - w/2;
  parts.forEach((p,i)=>{
    if(p.t!=null){ g.font=fontA; g.textAlign='left'; g.fillText(p.t, cx, y+size*0.04); }
    else { g.font=fontB; g.textAlign='center'; const mid=cx+ws[i]/2;
      g.fillText(p.n, mid, y-fs*0.62); g.fillText(p.d, mid, y+fs*0.68);
      g.fillRect(cx+size*0.12, y-Math.max(1,size*0.035), ws[i]-size*0.24, Math.max(1.5,size*0.07)); }
    cx += ws[i];
  });
  g.globalAlpha = 1;
}
function curvePts(ob, v){
  const pts = [], n = 90, v1 = v.v0 + (v.v1-v.v0)*clamp(v.p,0,1);
  for(let i=0;i<=n;i++){ const x = v.v0+(v1-v.v0)*i/n; const p = P(ob.X(x), ob.f(x), v.z); if(p) pts.push({p, x}); }
  return pts;
}
function drawCurve(ob, v){
  if(v.p<=0.001) return;
  const pts = curvePts(ob, v); if(pts.length<2) return;
  g.globalAlpha = v.a;
  if(ob.fill){
    g.beginPath(); pts.forEach((q,i)=> i? g.lineTo(q.p.x,q.p.y) : g.moveTo(q.p.x,q.p.y));
    for(let i=pts.length-1;i>=0;i--){ const b=P(ob.X(pts[i].x), 0, v.z); if(b) g.lineTo(b.x,b.y); }
    g.closePath(); g.fillStyle = ob.fill; g.fill();
  }
  g.beginPath(); pts.forEach((q,i)=> i? g.lineTo(q.p.x,q.p.y) : g.moveTo(q.p.x,q.p.y));
  g.strokeStyle = ob.color; g.lineWidth = (ob.width||3.5)*Math.min(1.4,W/800); g.lineJoin='round'; g.stroke();
  g.globalAlpha = 1;
}
function drawLine(ob, v){
  const a = P(v.x,v.y,v.z), b = P(v.x2,v.y2,v.z2); if(!a||!b) return;
  g.globalAlpha = v.a; g.strokeStyle = ob.color||'#475569'; g.lineWidth = ob.width||2;
  g.setLineDash(ob.dash ? [6,5] : []);
  g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); g.setLineDash([]);
  if(ob.arrow){ const ang=Math.atan2(b.y-a.y,b.x-a.x), s=9;
    [[a,ang+Math.PI],[b,ang]].forEach(([q,an])=>{ g.beginPath(); g.moveTo(q.x,q.y); g.lineTo(q.x-s*Math.cos(an-0.45), q.y-s*Math.sin(an-0.45)); g.moveTo(q.x,q.y); g.lineTo(q.x-s*Math.cos(an+0.45), q.y-s*Math.sin(an+0.45)); g.stroke(); }); }
  g.globalAlpha = 1;
}
function drawArc(ob, v){
  if(v.p<=0.001) return;
  g.globalAlpha = v.a; g.strokeStyle = ob.color||PINK; g.lineWidth = 3; g.setLineDash([7,6]);
  g.beginPath(); let first = true;
  for(let i=0;i<=40*v.p;i++){ const t=i/40, mt=1-t;
    const x = mt*mt*v.x + 2*mt*t*(v.x+v.x2)/2 + t*t*v.x2, y = mt*mt*v.y + 2*mt*t*(Math.max(v.y,v.y2)+ob.lift) + t*t*v.y2, z = mt*mt*v.z + 2*mt*t*(v.z+v.z2)/2 + t*t*v.z2;
    const p = P(x,y,z); if(!p) continue; first ? g.moveTo(p.x,p.y) : g.lineTo(p.x,p.y); first=false; }
  g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
}
function drawRing(ob, v){
  g.globalAlpha = v.a; g.beginPath();
  for(let i=0;i<=48;i++){ const an=i/48*Math.PI*2, p=P(v.x+v.r*Math.cos(an), 0.02, v.z+v.r*Math.sin(an)); if(!p) continue; i? g.lineTo(p.x,p.y) : g.moveTo(p.x,p.y); }
  g.closePath(); g.fillStyle = 'rgba(56,189,248,0.12)'; g.fill(); g.strokeStyle = ob.color||'#38bdf8'; g.lineWidth = 3; g.stroke();
  g.globalAlpha = 1;
}
function drawFloor(){
  const X0=-15, X1=15, Z0=-8, Z1=11;
  const cs = [P(X0,0,Z0),P(X1,0,Z0),P(X1,0,Z1),P(X0,0,Z1)];
  if(cs.every(Boolean)){ g.beginPath(); cs.forEach((p,i)=> i? g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.closePath(); g.fillStyle='rgba(255,255,255,0.75)'; g.fill(); }
  g.strokeStyle = 'rgba(100,116,139,0.13)'; g.lineWidth = 1;
  for(let x=X0;x<=X1;x+=1.5){ const a=P(x,0,Z0), b=P(x,0,Z1); if(a&&b){ g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
  for(let z=Z0;z<=Z1;z+=1.5){ const a=P(X0,0,z), b=P(X1,0,z); if(a&&b){ g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }
}

function frame(){
  const t = now();
  runScripts(t);
  updateCam(t);
  g.setTransform(DPR,0,0,DPR,0,0);
  const bgGr = g.createLinearGradient(0,0,0,Hc); bgGr.addColorStop(0,'#e8eef8'); bgGr.addColorStop(1,'#fdf4ea');
  g.fillStyle = bgGr; g.fillRect(0,0,W,Hc);
  drawFloor();
  const solids = [], overlay = [], labels = [], floorItems = [];
  for(const [id, ob] of objs){
    if(ob.dieAt && t > ob.dieAt){ objs.delete(id); continue; }
    const v = curVals(ob, t); if(v.a <= 0.003) continue;
    if(ob.type==='label') labels.push([ob,v]);
    else if(ob.type==='ring') floorItems.push([ob,v]);
    else if(ob.overlay) overlay.push([ob,v]);
    else {
      let c;
      if(ob.type==='curve') c = [ob.X((v.v0+v.v1)/2), 1, v.z];
      else if(ob.type==='line'||ob.type==='arc') c = [(v.x+v.x2)/2,(v.y+v.y2)/2,(v.z+v.z2)/2];
      else c = [v.x,v.y,v.z];
      const p = P(c[0],c[1],c[2]); if(!p) continue;
      solids.push([ob,v,p.d]);
    }
  }
  floorItems.forEach(([ob,v])=>drawRing(ob,v));
  solids.forEach(([ob,v])=>{ if(ob.type==='ball') drawShadow(v.x,v.y,v.z,v.r,v.a); else if(ob.type==='box' && v.h>0.01) drawShadow(v.x,v.y-v.h/2,v.z,Math.max(v.w,v.d)*0.6,v.a*0.8); });
  solids.sort((a,b)=>b[2]-a[2]);
  for(const [ob,v] of solids){
    if(ob.type==='ball') drawBall(v, ob.color);
    else if(ob.type==='box'){ if(v.h>0.01) drawBox(v, ob.color); }
    else if(ob.type==='curve') drawCurve(ob,v);
    else if(ob.type==='line') drawLine(ob,v);
    else if(ob.type==='arc') drawArc(ob,v);
  }
  overlay.forEach(([ob,v])=> ob.type==='curve' ? drawCurve(ob,v) : ob.type==='line' ? drawLine(ob,v) : null);
  const sc = clamp(W/820, 0.72, 1.25);
  labels.forEach(([ob,v])=>{ const p = P(v.x,v.y,v.z); if(p) drawRich(ob.text, p.x, p.y, (ob.size||15)*sc, ob.color||'#1e293b', ob.bg, v.a); });
  requestAnimationFrame(frame);
}

// ---- 段階内の予定（時間差で起きること）----
let scripts = [], stepT0 = 0, token = 0;
function at(sec, fn){ scripts.push({time: stepT0+sec, fn, tk: token}); }
function runScripts(t){
  if(!scripts.length) return;
  const due = scripts.filter(s=>s.time<=t && s.tk===token);
  scripts = scripts.filter(s=>s.time>t && s.tk===token);
  due.forEach(s=>s.fn());
}

function label(id, x,y,z, text, o={}, po={}){ place(id, {type:'label', x,y,z, text, size:o.size||15, color:o.color||'#1e293b', bg:o.bg===undefined?true:o.bg}, {dur:.6, ...po}); }
function line(id, x,y,z, x2,y2,z2, o={}, po={}){ place(id, {type:'line', x,y,z,x2,y2,z2, color:o.color||'#475569', width:o.width||2, dash:!!o.dash, arrow:!!o.arrow, overlay:!!o.overlay}, {dur:.6, ...po}); }
function curve(id, f, v0, v1, X, z, o={}, po={}){
  place(id, {type:'curve', f, v0, v1, X, z, p:1, color:o.color||PINK, fill:o.fill||null, width:o.width||3.5, overlay:o.overlay!==false}, {from:{p:0,a:1,z}, dur:o.dur||1.6, ...po});
}
function axis(pref, vals, X, z, unit, fmt=v=>v, z0=null, z1=null){
  line(pref+"ax", X(vals[0])-0.6,0.02,z, X(vals[vals.length-1])+0.6,0.02,z, {color:"#64748b", width:2});
  vals.forEach(v=>{
    line(pref+"k"+v, X(v),0.02,z-0.25, X(v),0.02,z+0.25, {color:"#64748b", width:1.5});
    if(z0!==null) line(pref+"g"+v, X(v),0.015,z0, X(v),0.015,z1, {color:"rgba(100,116,139,0.45)", width:1.2, dash:true});
    label(pref+'t'+v, X(v),0,z+1.0, String(fmt(v)), {size:12, color:'#475569', bg:false});
  });
  label(pref+'u', X(vals[vals.length-1])+1.6,0,z+1.0, unit, {size:12, color:'#475569', bg:false});
}
function pole(id, x, z, h, text, o={}){
  line(id, x,0,z, x,h,z, {color:o.color||'#0f172a', width:2, dash:true, overlay:true});
  if(text) label(id+'L', x, h+0.7, z, text, {size:o.size||14, color:o.color||'#0f172a'});
}

function buildSampDist1(instant){
  pop1("hist", {a:0.75}); popDist1(true, 7.4);

  const finish = ()=>{
    curve('sc1', v=>SAMP1.length*npdf(v,MU1,SD1/Math.sqrt(10))*1*k+0.05, 162, 180, H, Z-0.7, {color:'#b45309', width:4});

    SAMP1.forEach(s=>{ const b=Math.round(s.m); counts[b]=(counts[b]||0)+1; });

    label("cnt", H(187), 7.5, Z, `標本平均の個数：${SAMP1.length}`, {size:13, color:'#334155'});

  SAMP1.forEach((s,i)=>{
    const t = i<8 ? 0.4+i*0.45 : 4.0+(i-8)*0.014;
    const b = Math.round(s.m), x = H(b);

    });
    at(t+0.55, ()=>{
      kill('dr'+i); counts[b]=(counts[b]||0)+1;
      place('c1_'+b, {h:counts[b]*k, y:counts[b]*k/2}, {dur:.18});
      label("cnt", H(187), 7.5, Z, `標本平均の個数：${i+1}`, {size:13, color:'#334155'}, {dur:0});
    });

}

function buildSampDist2(){

const diceTowers = (o={}) => {
  for(let v=1;v<=6;v++) for(let j=0;j<6;j++)

function ridge(id, n, z, o={}){
  const sdw = SD_DIE/Math.sqrt(n);
  const f = v => 7.54*npdf(v,3.5,sdw)/2.2;
  curve(id, f, 3.5-Math.min(3.2,4.2*sdw), 3.5+Math.min(3.2,4.2*sdw), D, z, {color:o.color||PINK, fill:o.fill||'rgba(214,51,108,0.22)', width:3.5, overlay:false, dur:o.dur||1.4}, o.po||{});
  return f;
}

// ================= 画面の操作 =================
const CHS = [CH1, CH2];
let ch = 0, lv = 0, autoTimer = null;

function renderTabs(){
  $('tabs').innerHTML = CHS.map((c,i)=>`<button class="tab ${i===ch?'active':''}" data-ch="${i}">${c.title}</button>`).join('');
}
function renderSteps(){
  const steps = CHS[ch].steps;
  $('steps').innerHTML = steps.map((s,i)=>`<div class="step ${i>lv?'dim':''} ${i===lv?'active':''}" data-i="${i}">
    <span class="step-num">${i+1}</span><div><div class="step-title">${s.title}</div><div class="step-body">${i===lv?s.body():''}</div></div></div>`).join('');
  $('progress').textContent = `${lv+1} ／ ${steps.length}`;
  $('prevBtn').disabled = lv===0 && ch===0;
  $('nextBtn').disabled = lv===steps.length-1 && ch===CHS.length-1;
  $('nextBtn').textContent = lv===steps.length-1 && ch<CHS.length-1 ? '次の章へ ▶' : '次へ ▶';
  const sl = $('nslider');
  if(sl) sl.addEventListener('input', ()=>{ sliderN = +sl.value; $('nval').textContent = sliderN; $('sdval').textContent = (SD_DIE/Math.sqrt(sliderN)).toFixed(3); drawSliderRidge(false); });
}
function go(newCh, newLv){
  const chChanged = newCh !== ch;
  ch = newCh; lv = newLv; token++; scripts = []; stepT0 = now();
  if(chChanged){ objs.clear(); }
  keepSet = new Set();
  const st = CHS[ch].steps[lv];
  st.build();
  const keep = keepSet; keepSet = null;
  for(const id of [...objs.keys()]) if(!keep.has(id)) fadeOut(id, .5);
  setCam(st.cam);
  renderTabs(); renderSteps();
}
function next(){ const n = CHS[ch].steps.length; if(lv<n-1) go(ch, lv+1); else if(ch<CHS.length-1) go(ch+1, 0); }
function prev(){ if(lv>0) go(ch, lv-1); else if(ch>0) go(ch-1, CHS[ch-1].steps.length-1); }

$('nextBtn').onclick = ()=>{ stopAuto(); next(); };
$('prevBtn').onclick = ()=>{ stopAuto(); prev(); };
$('replayBtn').onclick = ()=>{ if(ch===0 && lv===0) objs.clear(); if(ch===1 && (lv===0||lv===3)) objs.clear(); go(ch, lv); };
$('viewBtn').onclick = ()=>{ userTo = {yaw:0,pitch:0,zoom:1}; };
$('tabs').onclick = e=>{ const b = e.target.closest('[data-ch]'); if(b){ stopAuto(); go(+b.dataset.ch, 0); } };
$('steps').onclick = e=>{
  const nb = e.target.closest('[data-n]');
  if(nb){ ch2N = +nb.dataset.n; go(ch, lv); return; }
  const s = e.target.closest('.step'); if(s && !s.classList.contains('active') && !e.target.closest('input')){ stopAuto(); go(ch, +s.dataset.i); }
};
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; $('autoBtn').textContent='▶ 通しで自動再生'; $('autoBtn').classList.remove('on'); } }
$('autoBtn').onclick = ()=>{
  if(autoTimer){ stopAuto(); return; }
  $('autoBtn').textContent = '■ 自動再生を止める'; $('autoBtn').classList.add('on');
  autoTimer = setInterval(()=>{ if($('nextBtn').disabled) stopAuto(); else next(); }, 10000);
};

// ドラッグで回転・ホイールで拡大縮小
let drag = null; const pts = new Map();
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); drag = {x:e.clientX, y:e.clientY}; });
cv.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const prevP = pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b] = [...pts.values()]; const d1 = Math.hypot(a.x-b.x,a.y-b.y);
    const other = [...pts.entries()].find(([id])=>id!==e.pointerId)[1]; const d0 = Math.hypot(prevP.x-other.x, prevP.y-other.y);
    if(d0>0){ userTo.zoom = clamp(userTo.zoom*d0/d1, 0.45, 2); user.zoom = userTo.zoom; } return; }
  const dx = e.clientX-prevP.x, dy = e.clientY-prevP.y;
  userTo.yaw -= dx*0.008; userTo.pitch += dy*0.006; userTo.pitch = clamp(userTo.pitch, -0.6, 0.9);
  user.yaw = userTo.yaw; user.pitch = userTo.pitch;
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev, e=>{ pts.delete(e.pointerId); }));
cv.addEventListener('wheel', e=>{ e.preventDefault(); userTo.zoom = clamp(userTo.zoom*(e.deltaY>0?1.08:0.93), 0.45, 2); }, {passive:false});
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight'){ stopAuto(); next(); } if(e.key==='ArrowLeft'){ stopAuto(); prev(); } });

resize();
go(0, 0);
requestAnimationFrame(frame);
})();
</script>
