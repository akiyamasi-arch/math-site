<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絶対値は「距離」｜数学学習サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
  /* サイト共通（assets/style.css）と同じトークン。アプリは1ファイル完結にするためここに再掲 */
  :root{
    --orange-50:#FFEEE2; --orange-100:#FFDFCA; --orange-400:#FF8D44;
    --orange-700:#E25100; --orange-800:#C74700; --orange-900:#AC3E00;
    --ink:#1E293B; --sub:#475569; --line:#D9DEE6; --line-strong:#B9C2CF;
    --bg:#FBFBFA; --card:#FFFFFF; --focus:#FFD866;
    --pcol:#6D28D9; --acol:#C74700; --ok:#1b5e20;
    --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px;
    --radius-sm:4px; --radius-md:8px; --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;}
  a{color:var(--orange-800);}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .brand-bar{height:6px;background:var(--orange-700);}
  .site-header{background:var(--card);border-bottom:1px solid var(--line);padding:var(--sp-2);}
  .site-header .inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;}
  .site-title{margin:0;font-size:18px;font-weight:700;}
  .site-title a{color:var(--ink);text-decoration:none;}
  .back-link{font-size:14px;font-weight:700;}
  .wrap{max-width:1100px;margin:0 auto;padding:var(--sp-3) var(--sp-2) var(--sp-6);}
  h1{margin:0 0 4px;font-size:26px;line-height:1.4;}
  .lead{margin:0 0 var(--sp-3);color:var(--sub);font-size:15px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-2) var(--sp-3);}
  .section-title{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 var(--sp-1);}
  .controls{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:end;}
  .expr{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:22px;font-weight:700;}
  .expr input{font-size:18px;padding:6px 4px;border:1px solid var(--line-strong);border-radius:var(--radius-md);width:60px;text-align:center;font-family:inherit;}
  .expr select{font-size:18px;padding:6px 4px;border:1px solid var(--line-strong);border-radius:var(--radius-md);font-family:inherit;background:#fff;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--sub);}
  .slider-field{flex:1 1 260px;min-width:220px;}
  .slider-field input[type=range]{width:100%;height:32px;accent-color:var(--pcol);}
  .presets{display:flex;flex-wrap:wrap;gap:8px;}
  .presets button, .btn{border:1px solid var(--line);background:#f8fafc;color:var(--ink);padding:8px 14px;border-radius:var(--radius-pill);font-size:14px;cursor:pointer;font-family:inherit;}
  .presets button:hover, .btn:hover{border-color:var(--orange-800);background:var(--orange-50);}
  .btn:disabled{opacity:.35;cursor:default;}
  .btn.primary{background:var(--orange-800);color:#fff;border-color:var(--orange-800);font-weight:700;}
  .btn.primary:hover{background:var(--orange-900);color:#fff;}
  .note{font-size:14px;color:var(--sub);margin:8px 0 0;}

  .main-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--sp-2);align-items:start;margin-top:var(--sp-2);}
  @media (max-width:900px){ .main-grid{grid-template-columns:1fr;} }
  .figure svg{width:100%;height:auto;display:block;touch-action:none;}
  .values{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--sp-1);}
  .chip{border:1px solid var(--line);border-radius:var(--radius-pill);padding:4px 14px;font-size:15px;background:#fff;}
  .chip.p{border-color:var(--pcol);color:var(--pcol);}
  .chip.yes{border-color:#2e7d32;color:var(--ok);background:#e8f5e9;font-weight:700;}
  .chip.no{color:var(--sub);background:#f1f5f9;}

  /* 思考のステップ（クリックで巻き戻し／早送り） */
  .stepper{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:var(--sp-2);padding-bottom:12px;border-bottom:1px dashed var(--line);}
  .stepper .progress{font-size:12px;font-weight:700;color:var(--sub);text-align:center;flex:1;}
  .steps{display:flex;flex-direction:column;gap:10px;}
  .step{display:flex;gap:10px;padding:6px 8px;margin:0 -8px;border-radius:var(--radius-md);cursor:pointer;}
  .step:hover{background:#f8fafc;}
  .step.dim{opacity:.4;}
  .step-num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .step.dim .step-num{background:#cbd5e1;}
  .step-body{font-size:14px;line-height:1.7;}
  .mono{font-family:Consolas,"Courier New",monospace;background:#f1f5f9;padding:1px 6px;border-radius:5px;}

  .answer{margin-top:var(--sp-2);padding:14px 16px;border:1.5px solid var(--orange-800);border-radius:var(--radius-md);background:linear-gradient(135deg,#fff3ea,#fff);}
  .answer .label{font-size:12px;font-weight:700;color:var(--orange-800);}
  .answer .value{font-size:22px;font-weight:800;}
  .answer.pending{opacity:.6;}
  .answer.pending .value{font-size:15px;font-weight:400;}
  .warn{background:#fff3cd;border:1px solid #ffe08a;color:#7a5b00;padding:10px 14px;border-radius:var(--radius-md);font-size:14px;margin-top:var(--sp-1);}

  .quiz{margin-top:var(--sp-3);}
  .q{padding:12px 0;border-top:1px solid var(--line);}
  .q:first-child{border-top:none;}
  .q .qtext{font-size:15px;font-weight:700;margin-bottom:8px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opts button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:var(--radius-md);font-size:16px;cursor:pointer;font-family:inherit;min-height:44px;}
  .opts button:hover{border-color:var(--orange-800);background:var(--orange-50);}
  .opts button.ok{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;font-weight:700;}
  .opts button.ng{background:#fdecea;border-color:#c62828;color:#b71c1c;}
  .fb{font-size:14px;margin-top:8px;color:var(--sub);}
  .fb.ok{color:#1b5e20;}
</style>
</head>
<body>

<div class="brand-bar"></div>
<header class="site-header">
  <div class="inner">
    <p class="site-title"><a href="../index.html">数学学習サイト</a></p>
    <a class="back-link" href="../unit.html?s=math1&u=kazu-shiki">← 単元ページに戻る</a>
  </div>
</header>

<div class="wrap">
  <h1>絶対値は「距離」</h1>
  <p class="lead">数直線の上で点 P を動かしながら、|x| が「原点からの距離」、|x − a| が「点 a からの距離」であることを確かめます。そこから、|x − a| &lt; b のような絶対値を含む方程式・不等式の答えを、図から読み取ります。</p>

  <div class="card">
    <div class="controls">
      <div class="expr" aria-label="考える式">
        |x −<input type="number" id="a" value="3" min="-6" max="6" aria-label="a">|
        <select id="op" aria-label="記号"><option>=</option><option selected>&lt;</option><option>≦</option><option>&gt;</option><option>≧</option></select>
        <input type="number" id="b" value="2" min="1" max="6" aria-label="b">
      </div>
      <div class="presets">
        <button type="button" data-a="3" data-op="<" data-b="2">例① |x−3| &lt; 2</button>
        <button type="button" data-a="-1" data-op="≧" data-b="3">例② |x+1| ≧ 3</button>
        <button type="button" data-a="0" data-op="=" data-b="4">例③ |x| = 4</button>
        <button type="button" data-a="-2" data-op="≦" data-b="1">例④ |x+2| ≦ 1</button>
      </div>
    </div>
    <p class="note" id="exprNote"></p>
    <div id="inputNote"></div>
  </div>

  <div class="main-grid">
    <div class="card figure">
      <p class="section-title">数直線（点 P は図の上でドラッグしても動かせます）</p>
      <div id="figure"></div>
      <div class="field slider-field" style="margin-top:8px;">
        <label for="px">点 P の位置 x</label>
        <input type="range" id="px" min="-10" max="10" step="0.5" value="4">
      </div>
      <div class="values" id="values"></div>
    </div>

    <div>
      <div class="card">
        <p class="section-title">思考のステップ</p>
        <div class="stepper">
          <button class="btn" id="prevBtn">◀ 前へ</button>
          <span class="progress" id="progress"></span>
          <button class="btn primary" id="nextBtn">次へ ▶</button>
        </div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="answer pending" id="answer">
        <div class="label">答え</div>
        <div class="value" id="answerValue">ステップを最後まで進めると表示されます</div>
      </div>
    </div>
  </div>

  <div class="card quiz">
    <p class="section-title">確認問題（図を思いうかべて答えよう）</p>
    <div id="quiz"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const MINUS = '−';
  const num = n => (n < 0 ? MINUS + Math.abs(n) : String(n));
  const f = v => num(Math.round(v * 10) / 10);

  const LABELS = ['① 数直線と点P', '② |x| は原点からの距離', '③ |x − a| は a からの距離', '④ 距離がちょうど b の点', '⑤ 条件に合う部分を塗る'];
  const MAX_LEVEL = 4;
  let level = 0, a = 3, b = 2, op = '<', P = 4;

  const absExpr = () => a === 0 ? '|x|' : a > 0 ? `|x − ${a}|` : `|x + ${-a}|`;
  const satisfies = x => {
    const d = Math.abs(x - a);
    return op === '=' ? Math.abs(d - b) < 1e-9 : op === '<' ? d < b - 1e-9 : op === '≦' ? d <= b + 1e-9 : op === '>' ? d > b + 1e-9 : d >= b - 1e-9;
  };
  function answerText(){
    const L = num(a - b), R = num(a + b);
    if(op === '=') return a === 0 ? `x = ±${b}` : `x = ${L}, ${R}`;
    if(op === '<') return `${L} < x < ${R}`;
    if(op === '≦') return `${L} ≦ x ≦ ${R}`;
    if(op === '>') return `x < ${L}, ${R} < x`;
    return `x ≦ ${L}, ${R} ≦ x`;
  }

  // ---- 図 ----
  const W = 620, x0 = 30, x1 = 590, LO = -10, HI = 10, yA = 150;
  const px = v => x0 + (v - LO) / (HI - LO) * (x1 - x0);
  function drawFigure(){
    let g = `<rect x="0" y="0" width="${W}" height="240" fill="#ffffff"/>`;
    const lab = (x, y, s, c, sz, anchor, w) => `<text x="${x}" y="${y}" font-size="${sz || 14}" font-weight="${w || 700}" fill="${c}" text-anchor="${anchor || 'middle'}">${s}</text>`;

    // 条件に合う部分（⑤）
    if(level >= 4){
      const L = a - b, R = a + b, inc = op !== '<' && op !== '>';
      const band = (u, v) => `<rect x="${px(Math.max(u, LO))}" y="${yA - 9}" width="${Math.max(px(Math.min(v, HI)) - px(Math.max(u, LO)), 0)}" height="18" rx="4" fill="rgba(46,125,50,0.28)"/>`;
      if(op === '<' || op === '≦') g += band(L, R);
      else if(op === '>' || op === '≧'){ g += band(LO - 1, L); g += band(R, HI + 1); }
      [L, R].forEach(v => { if(v >= LO && v <= HI) g += `<circle cx="${px(v)}" cy="${yA}" r="7" fill="${inc ? '#1b5e20' : '#fff'}" stroke="#1b5e20" stroke-width="2.5"/>`; });
    }

    // 軸
    g += `<line x1="${x0 - 10}" y1="${yA}" x2="${x1 + 14}" y2="${yA}" stroke="#334155" stroke-width="2"/>`;
    g += `<polygon points="${x1 + 14},${yA - 5} ${x1 + 24},${yA} ${x1 + 14},${yA + 5}" fill="#334155"/>`;
    for(let v = LO; v <= HI; v++){
      g += `<line x1="${px(v)}" y1="${yA - 5}" x2="${px(v)}" y2="${yA + 5}" stroke="#94a3b8" stroke-width="${v === 0 ? 2.5 : 1.3}"/>`;
      g += lab(px(v), yA + 24, num(v), v === 0 ? '#1E293B' : '#94a3b8', 12, 'middle', v === 0 ? 700 : 400);
    }
    g += lab(px(0), yA + 40, 'O', '#1E293B', 12);

    // ② 原点からの距離
    if(level >= 1){
      const y = yA - 30;
      g += `<line x1="${px(0)}" y1="${y}" x2="${px(P)}" y2="${y}" stroke="#94a3b8" stroke-width="3" ${level >= 2 ? 'stroke-dasharray="4 4"' : ''}/>`;
      g += lab((px(0) + px(P)) / 2, y - 8, `|${f(P)}| = ${f(Math.abs(P))}`, level >= 2 ? '#94a3b8' : '#475569', 14);
    }
    // ③ a からの距離
    if(level >= 2){
      const y = yA - 64;
      g += `<circle cx="${px(a)}" cy="${yA}" r="6" fill="#C74700"/>`;
      g += lab(px(a), yA + 58, `a = ${num(a)}`, '#C74700', 13);
      g += `<line x1="${px(a)}" y1="${yA}" x2="${px(a)}" y2="${y}" stroke="#C74700" stroke-width="1.2" stroke-dasharray="3 3"/>`;
      g += `<line x1="${px(a)}" y1="${y}" x2="${px(P)}" y2="${y}" stroke="#6D28D9" stroke-width="4"/>`;
      g += lab((px(a) + px(P)) / 2, y - 10, `${absExpr().replace('x', f(P))} = ${f(Math.abs(P - a))}`, '#6D28D9', 15);
    }
    // ④ 距離がちょうど b の点
    if(level >= 3){
      const L = a - b, R = a + b, y = yA - 100;
      [[L, a], [a, R]].forEach(([u, v]) => {
        g += `<path d="M${px(u)},${yA - 12} Q${(px(u) + px(v)) / 2},${y - 10} ${px(v)},${yA - 12}" fill="none" stroke="#C74700" stroke-width="2" stroke-dasharray="6 4"/>`;
        g += lab((px(u) + px(v)) / 2, y + 2, `距離 ${b}`, '#C74700', 13);
      });
      [L, R].forEach(v => {
        if(v >= LO && v <= HI){
          if(level < 4) g += `<circle cx="${px(v)}" cy="${yA}" r="6" fill="#fff" stroke="#C74700" stroke-width="2.5"/>`;
          g += lab(px(v), yA + 58, num(v), '#C74700', 14);
        }
      });
    }
    // 点 P（常に）
    const ok = level >= 4 && satisfies(P);
    const pc = level >= 4 ? (ok ? '#1b5e20' : '#94a3b8') : '#6D28D9';
    g += `<g id="pHandle" style="cursor:grab"><circle cx="${px(P)}" cy="${yA}" r="16" fill="transparent"/><circle cx="${px(P)}" cy="${yA}" r="9" fill="${pc}" stroke="#fff" stroke-width="2"/></g>`;
    g += lab(px(P), yA - 14 - (level >= 1 ? 0 : 0), '', pc);
    g += lab(px(P) + 12, yA - 12, 'P', pc, 15, 'start');
    $('figure').innerHTML = `<svg id="svg" viewBox="0 0 ${W} 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="数直線と点P">${g}</svg>`;
    attachDrag();
  }

  // ---- ドラッグ ----
  function attachDrag(){
    const svg = $('svg');
    let dragging = false;
    const toVal = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return Math.max(LO, Math.min(HI, Math.round(((p.x - x0) / (x1 - x0) * (HI - LO) + LO) * 2) / 2));
    };
    svg.addEventListener('pointerdown', e => { dragging = true; svg.setPointerCapture(e.pointerId); setP(toVal(e)); });
    svg.addEventListener('pointermove', e => { if(dragging) setP(toVal(e)); });
    svg.addEventListener('pointerup', () => { dragging = false; });
  }
  function setP(v){
    if(v === P) return;
    P = v; $('px').value = v;
    drawFigure(); renderInfo();
  }

  // ---- ステップ・値 ----
  function buildSteps(){
    const d = Math.abs(P - a);
    return [
      { level: 1, body: `<span class="mono">|x|</span> は、数直線で <b>原点 O から x までの距離</b>。いま P は ${f(P)} なので <span class="mono">|${f(P)}| = ${f(Math.abs(P))}</span>。マイナスの数でも距離はプラス。` },
      { level: 2, body: `<span class="mono">|x − a|</span> は、<b>点 a から x までの距離</b>。いまは a = ${num(a)} なので <span class="mono">${absExpr()}</span> は「${num(a)} からの距離」＝ ${f(d)}。` + (a < 0 ? `<br><span style="color:var(--sub)">※ <span class="mono">${absExpr()} = |x − (${num(a)})|</span> なので、「+${-a}」は「${num(a)} からの距離」と読む。</span>` : '') },
      { level: 3, body: `${num(a)} から距離がちょうど ${b} の点は、左に ${b} 進んだ <b>${num(a - b)}</b> と、右に ${b} 進んだ <b>${num(a + b)}</b> の2つ。` },
      { level: 4, body: `<span class="mono">${absExpr()} ${op} ${b}</span> は「${num(a)} からの距離が ${b} ${op === '=' ? 'ちょうど' : op === '<' ? 'より小さい' : op === '≦' ? '以下' : op === '>' ? 'より大きい' : '以上'}」ということ。` +
          (op === '=' ? '→ 2つの点だけ。' : (op === '<' || op === '≦') ? `→ ${num(a)} の<b>近く</b>（2点の内側）。` : `→ ${num(a)} から<b>遠く</b>（2点の外側）。`) +
          ` P を動かして、塗られた部分で緑になるか確かめよう。` }
    ];
  }
  function renderInfo(){
    $('steps').innerHTML = buildSteps().map((s, i) =>
      `<div class="step${s.level > level ? ' dim' : ''}" data-level="${s.level}">
         <div class="step-num">${i + 1}</div><div class="step-body">${s.body}</div>
       </div>`).join('');
    $('steps').querySelectorAll('.step').forEach(el => el.addEventListener('click', () => goTo(+el.dataset.level)));
    $('progress').textContent = LABELS[level];
    $('prevBtn').disabled = level <= 0;
    $('nextBtn').disabled = level >= MAX_LEVEL;
    const chips = [`<span class="chip p"><b>P の x</b> = ${f(P)}</span>`];
    if(level >= 1) chips.push(`<span class="chip"><b>|x|</b> = ${f(Math.abs(P))}</span>`);
    if(level >= 2) chips.push(`<span class="chip"><b>${absExpr()}</b> = ${f(Math.abs(P - a))}</span>`);
    if(level >= 4) chips.push(satisfies(P) ? `<span class="chip yes">P は ${absExpr()} ${op} ${b} を満たす</span>` : `<span class="chip no">P は ${absExpr()} ${op} ${b} を満たさない</span>`);
    $('values').innerHTML = chips.join('');
    const ans = $('answer');
    if(level >= MAX_LEVEL){ ans.classList.remove('pending'); $('answerValue').textContent = `${absExpr()} ${op} ${b} の解は　${answerText()}`; }
    else { ans.classList.add('pending'); $('answerValue').textContent = 'ステップを最後まで進めると表示されます'; }
  }
  function goTo(n){
    level = Math.max(0, Math.min(MAX_LEVEL, n));
    drawFigure(); renderInfo();
  }

  // 式を変えても段階は保つ（P を動かして確かめる探究型）
  function readInput(){
    const av = Number($('a').value), bv = Number($('b').value);
    if(!Number.isInteger(av) || av < -6 || av > 6 || !Number.isInteger(bv) || bv < 1 || bv > 6){
      $('inputNote').innerHTML = '<div class="warn">a は −6〜6、b は 1〜6 の整数を入れてください。</div>';
      return;
    }
    $('inputNote').innerHTML = '';
    a = av; b = bv; op = $('op').value;
    $('exprNote').textContent = a < 0 ? `${absExpr()} は |x − (${num(a)})| のこと。つまり「${num(a)} からの距離」です。` : a === 0 ? '|x| は |x − 0|、つまり「0 からの距離」です。' : '';
    goTo(level);
  }

  // ---- 確認問題 ----
  const QUIZ = [
    { q: '|x − 3| < 2 の解は？', opts: ['1 < x < 5', 'x < 1, 5 < x', `${MINUS}5 < x < ${MINUS}1`, 'x < 5'], ans: 0,
      exp: '「3 からの距離が 2 より小さい」→ 3 の近く。3−2=1 と 3+2=5 の内側。' },
    { q: '|x + 1| ≧ 3 の解は？', opts: [`${MINUS}4 ≦ x ≦ 2`, `x ≦ ${MINUS}4, 2 ≦ x`, `x ≦ ${MINUS}2, 4 ≦ x`, 'x ≧ 2'], ans: 1,
      exp: `|x + 1| は「${MINUS}1 からの距離」。それが 3 以上 → ${MINUS}1−3=${MINUS}4 と ${MINUS}1+3=2 の外側（両端をふくむ）。` },
    { q: '|x| = 4 の解は？', opts: ['x = 4', `x = ${MINUS}4`, `x = ±4`, `${MINUS}4 ≦ x ≦ 4`], ans: 2,
      exp: '原点からの距離がちょうど 4 の点は、右の 4 と左の −4 の2つ。' }
  ];
  function renderQuiz(){
    $('quiz').innerHTML = QUIZ.map((it, i) =>
      `<div class="q"><div class="qtext">問${i + 1}　${it.q}</div><div class="opts" data-q="${i}">` +
      it.opts.map((o, j) => `<button type="button" data-i="${j}">${o}</button>`).join('') +
      `</div><div class="fb" id="fb${i}"></div></div>`).join('');
    $('quiz').querySelectorAll('.opts').forEach(box => {
      const qi = +box.dataset.q;
      box.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
        const pick = +btn.dataset.i, ok = QUIZ[qi].ans;
        box.querySelectorAll('button').forEach(b2 => b2.classList.remove('ok', 'ng'));
        btn.classList.add(pick === ok ? 'ok' : 'ng');
        if(pick !== ok) box.querySelectorAll('button')[ok].classList.add('ok');
        const fb = $('fb' + qi);
        fb.className = 'fb' + (pick === ok ? ' ok' : '');
        fb.textContent = (pick === ok ? '正解！ ' : 'おしい。正解は ' + QUIZ[qi].opts[ok] + '。') + QUIZ[qi].exp;
      }));
    });
  }

  document.querySelectorAll('.presets button').forEach(btn => btn.addEventListener('click', () => {
    $('a').value = btn.dataset.a; $('b').value = btn.dataset.b; $('op').value = btn.dataset.op; readInput();
  }));
  ['a', 'b', 'op'].forEach(id => $(id).addEventListener('input', readInput));
  $('px').addEventListener('input', () => setP(Number($('px').value)));
  $('prevBtn').addEventListener('click', () => goTo(level - 1));
  $('nextBtn').addEventListener('click', () => goTo(level + 1));

  renderQuiz();
  readInput();
})();
</script>
</body>
</html>
